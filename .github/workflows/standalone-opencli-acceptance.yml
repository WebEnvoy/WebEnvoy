name: Standalone OpenCLI public read acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/standalone-opencli-acceptance.yml"
      - "apps/desktop/agent-entry/**"
      - "apps/desktop/scripts/standalone-opencli-public-read-check.mjs"
      - "apps/desktop/scripts/runtime-source-lock.json"
      - "apps/desktop/scripts/package-lode-assets.mjs"
      - "packages/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CAMOUFOX_BROWSER_URL: https://github.com/daijro/camoufox/releases/download/v152.0.4-beta.30/camoufox-152.0.4-beta.30-mac.arm64.zip
  CAMOUFOX_BROWSER_SHA256: 3b43e766574f286a6a63296cf58b660b7a3120952086c869b4df4c9a71604bc3
  CAMOUFOX_WHEEL_URL: https://files.pythonhosted.org/packages/6f/b3/5f93b720522cbc9e95d8b2a5e47a6a1797b61e45bd1f9a220f9a985af9e1/camoufox-0.5.6-py3-none-any.whl
  CAMOUFOX_WHEEL_SHA256: b906836cd952376a466f0e55445f139b8a65adfb9f18ab55cb2cd0c727b11561
  PLAYWRIGHT_WHEEL_URL: https://files.pythonhosted.org/packages/59/7b/e1d32ae8a3ed937ec2be3721c5f728b13d731a0b7c6442e0b3bec5094ac0/playwright-1.60.0-py3-none-macosx_11_0_arm64.whl
  PLAYWRIGHT_WHEEL_SHA256: 39b5420ba6145045b69ced4c5c47d4d9fe5bddfc8ff816c518913afcb25ec7a5

jobs:
  public-read:
    name: macOS arm64 installed OpenCLI public reads
    runs-on: macos-14
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PACKAGE_ROOT: /tmp/webenvoy-opencli-ci/webenvoy-standalone-macos-arm64
      LODE_ROOT: ${{ github.workspace }}/.runtime-sources/lode
      EVIDENCE_ROOT: /tmp/webenvoy-opencli-evidence
      MATERIAL_ROOT: /tmp/webenvoy-opencli-provider-materials
    steps:
      - name: Check out exact WebEnvoy candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up fixed Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - name: Set up fixed arm64 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          architecture: arm64
      - name: Enable pinned pnpm and verify host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          corepack enable
          corepack prepare pnpm@10.30.3 --activate
          test "$(node --version)" = v24.14.0
          test "$(pnpm --version)" = 10.30.3
          test "$(python --version)" = 'Python 3.12.10'

      - name: Resolve locked Lode source
        id: lode
        shell: bash
        run: echo "ref=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("apps/desktop/scripts/runtime-source-lock.json", "utf8")).lode.commit)')" >> "$GITHUB_OUTPUT"
      - name: Check out locked Lode source
        uses: actions/checkout@v4
        with:
          repository: WebEnvoy/Lode
          ref: ${{ steps.lode.outputs.ref }}
          path: .runtime-sources/lode
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C "$LODE_ROOT" rev-parse HEAD)" = "${{ steps.lode.outputs.ref }}"
          test -z "$(git status --porcelain --untracked-files=all -- . ':(exclude).runtime-sources' ':(exclude).runtime-sources/**')"
          test -z "$(git -C "$LODE_ROOT" status --porcelain)"
          sudo -n -u nobody -- /usr/bin/id -u >/dev/null

      - name: Diagnose direct public HTTPS reachability
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { lookup } from 'node:dns/promises';
          import { request } from 'node:https';
          const records = await lookup('github.com', { all: true, verbatim: true });
          const first = records[0];
          const result = { dns_families: records.map(item => item.family), proxy_configured: Boolean(process.env.HTTPS_PROXY || process.env.https_proxy) };
          if (first) await new Promise(resolve => {
            const call = request('https://github.com/trending?since=daily', {
              method: 'GET', agent: false, servername: 'github.com',
              lookup: (_host, _options, callback) => callback(null, first.address, first.family),
              headers: { accept: 'text/html', 'user-agent': 'Mozilla/5.0 (compatible; opencli/github-trending)' },
              timeout: 10000
            }, response => { result.status = response.statusCode; response.destroy(); resolve(); });
            call.once('error', error => { result.error_code = error.code ?? error.name; resolve(); });
            call.once('timeout', () => call.destroy(Object.assign(new Error('timeout'), { code: 'ETIMEDOUT' })));
            call.end();
          });
          console.log(JSON.stringify(result));
          NODE

      - name: Build and verify one standalone candidate
        env:
          WEBENVOY_LODE_ASSETS_SOURCE_DIR: ${{ env.LODE_ROOT }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @webenvoy/app package:standalone "$PACKAGE_ROOT"
          pnpm --filter @webenvoy/app check:standalone "$PACKAGE_ROOT"

      - name: Prepare pinned Profile Provider materials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MATERIAL_ROOT/browser"
          browser_archive="$MATERIAL_ROOT/camoufox-152.0.4-beta.30-mac.arm64.zip"
          camoufox_wheel="$MATERIAL_ROOT/camoufox-0.5.6-py3-none-any.whl"
          playwright_wheel="$MATERIAL_ROOT/playwright-1.60.0-py3-none-macosx_11_0_arm64.whl"
          curl --fail --location --retry 3 --silent --show-error "$CAMOUFOX_BROWSER_URL" --output "$browser_archive"
          curl --fail --location --retry 3 --silent --show-error "$CAMOUFOX_WHEEL_URL" --output "$camoufox_wheel"
          curl --fail --location --retry 3 --silent --show-error "$PLAYWRIGHT_WHEEL_URL" --output "$playwright_wheel"
          printf '%s  %s\n' "$CAMOUFOX_BROWSER_SHA256" "$browser_archive" | shasum -a 256 -c -
          printf '%s  %s\n' "$CAMOUFOX_WHEEL_SHA256" "$camoufox_wheel" | shasum -a 256 -c -
          printf '%s  %s\n' "$PLAYWRIGHT_WHEEL_SHA256" "$playwright_wheel" | shasum -a 256 -c -
          unzip -q "$browser_archive" -d "$MATERIAL_ROOT/browser"
          test "$(shasum -a 256 "$MATERIAL_ROOT/browser/Camoufox.app/Contents/Resources/properties.json" | awk '{print $1}')" = 10d5cfb6c8eb3824485734362a3920e07b36c3801770fffcc14a3546e56f81f4
          python -m venv "$MATERIAL_ROOT/venv"
          "$MATERIAL_ROOT/venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --no-input "$camoufox_wheel" "$playwright_wheel"
          "$MATERIAL_ROOT/venv/bin/python" -I -B -c 'import importlib.metadata as m; assert m.version("camoufox") == "0.5.6"; assert m.version("playwright") == "1.60.0"'

      - name: Run three fixed public tasks through the installed entry
        run: node apps/desktop/scripts/standalone-opencli-public-read-check.mjs "$PACKAGE_ROOT" "$LODE_ROOT" "$EVIDENCE_ROOT" "$MATERIAL_ROOT"

      - name: Preserve bounded candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webenvoy-opencli-${{ env.SOURCE_SHA }}-${{ steps.lode.outputs.ref }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ env.EVIDENCE_ROOT }}
